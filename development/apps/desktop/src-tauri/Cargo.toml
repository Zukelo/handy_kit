[package]
name = "handykit"
version = "0.2.0"
description = "小工坊开发工具集"
edition = "2021"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
handykit-scheduler = { path = "../../../crates/scheduler" }
handykit-plugin-host = { path = "../../../crates/plugin-host" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
chrono = "0.4"
