[package]
name = "handykit-process"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_System_Threading", "Win32_System_SystemInformation"] }
