name: Checks

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: development/apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install frontend dependencies
        working-directory: development/apps/desktop
        run: npm ci
      - name: Test workspace and home
        working-directory: development/apps/desktop
        run: npm test
      - name: Build frontend
        working-directory: development/apps/desktop
        run: npm run build
      - name: Test Rust timer core
        run: cargo test --manifest-path development/crates/scheduler/Cargo.toml --locked
      - name: Check Rust formatting
        run: |
          cargo fmt --manifest-path development/apps/desktop/src-tauri/Cargo.toml -- --check
          cargo fmt --manifest-path development/crates/scheduler/Cargo.toml -- --check
      - name: Check migration and release tooling
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Check shared design system and theme contrast
        run: python3 scripts/check_design_system.py
      - name: Check appearance controller
        run: node --test scripts/test_appearance.cjs
      - name: Check version consistency
        run: python3 scripts/check_version.py

  timer-platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - name: Test platform executor and scheduler
        run: cargo test --manifest-path development/crates/scheduler/Cargo.toml --locked
