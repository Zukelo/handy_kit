name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag, e.g. v0.1.0-rc.1 (must be on main)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref_name }}
      - name: Validate tag, version and main ancestry
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python3 scripts/check_version.py --tag "$RELEASE_TAG"
          git show-ref --verify "refs/tags/$RELEASE_TAG"
          git merge-base --is-ancestor HEAD origin/main
          printf 'tag=%s\n' "$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows
            arch: x64
            edition: online
            args: --bundles nsis --config src-tauri/tauri.online.conf.json
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows
            arch: x64
            edition: offline
            args: --bundles nsis --config src-tauri/tauri.offline.conf.json
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: macos
            arch: arm64
            edition: system-webview
            args: --bundles dmg
          - os: macos-latest
            target: x86_64-apple-darwin
            platform: macos
            arch: x64
            edition: system-webview
            args: --bundles dmg
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux
            arch: x64
            edition: system-webview
            args: --bundles deb,appimage
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate.outputs.tag }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: development/apps/desktop/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils
      - name: Install frontend dependencies
        working-directory: development/apps/desktop
        run: npm ci
      - name: Build native bundles
        working-directory: development/apps/desktop
        run: npm run tauri:build -- --target ${{ matrix.target }} ${{ matrix.args }} -- --locked
      - name: Collect and name release files
        run: python scripts/collect_release.py --target ${{ matrix.target }} --platform ${{ matrix.platform }} --arch ${{ matrix.arch }} --edition ${{ matrix.edition }} --tag ${{ needs.validate.outputs.tag }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packages-${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.edition }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [validate, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: packages-*
          merge-multiple: true
          path: release-assets
      - name: Publish complete release with checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 6
          sha256sum * > SHA256SUMS.txt
          cat > /tmp/release-notes.md <<'NOTES'
          小工坊 HandyKit 跨平台安装包。

          - Windows x64：online 安装时可下载 WebView2；offline 随包携带离线安装器。
          - macOS arm64 / x64：使用系统 WKWebView；当前仅 ad-hoc 签名，尚未进行 Apple 公证。
          - Linux x64：deb / AppImage，依赖系统 WebKitGTK，不声明完全自包含离线安装。
          - SHA256SUMS.txt 提供文件完整性校验。

          当前应用仍处于原型开发阶段。Windows 尚未配置代码签名证书。
          NOTES
          # Build failures never reach this job. Re-runs update the same release.
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "HandyKit $RELEASE_TAG" --notes-file /tmp/release-notes.md
          fi
          gh release upload "$RELEASE_TAG" ./* --clobber
          if [[ "$RELEASE_TAG" == *-* ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest
          fi
